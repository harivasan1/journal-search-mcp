version: '3.8'
services:
  app:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    environment:
      # Skip upstream readiness checks inside containers (useful for CI/offline runs)
      - SKIP_UPSTREAM_CHECKS=true
    ports:
      - "8000:8000"
    volumes:
      - app-data:/data
    healthcheck:
      # Use Python stdlib for the healthcheck to avoid depending on curl
      # The command performs a simple GET to /ready and exits non-zero on failure.
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys, urllib.request\ntry:\n    r = urllib.request.urlopen('http://localhost:8000/ready', timeout=5)\n    sys.exit(0 if r.getcode() == 200 else 1)\nexcept Exception:\n    sys.exit(1)\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3

  tests:
    build: .
    volumes:
      - .:/app:cached
      - app-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    command: pytest -q
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
    driver: local
