version: '3.8'
services:
  app:
    build: .
    command: uvicorn fastapi_app:app --host 0.0.0.0 --port 8000
    environment:
      # Skip upstream readiness checks inside containers (useful for CI/offline runs)
      - SKIP_UPSTREAM_CHECKS=true
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  tests:
    build: .
    volumes:
      - .:/app:cached
    environment:
      - SKIP_UPSTREAM_CHECKS=true
      - PYTHONUNBUFFERED=1
    command: pytest -q
    depends_on:
      app:
        condition: service_healthy
