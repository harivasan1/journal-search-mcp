apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: journal-search
  template:
    metadata:
      labels:
        app: journal-search
    spec:
      containers:
        - name: journal-search
          image: your-registry/journal-search:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
